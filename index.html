    <script>
      // Suppress ambient WebSocket errors from Vite dev server when running inside preview iframes
      window.addEventListener('error', function(e) {
        if (e.message && e.message.includes('WebSocket')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (e.reason.message?.includes('WebSocket') || String(e.reason).includes('WebSocket'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
