<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3e8ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4c1d95" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Decorative sparkles -->
  <circle cx="108" cy="118" r="8" fill="#fef08a" opacity="0.9" />
  <circle cx="410" cy="100" r="10" fill="#fef08a" opacity="0.8" />
  <circle cx="430" cy="380" r="7" fill="#ffffff" opacity="0.75" />
  <circle cx="85" cy="390" r="9" fill="#ffffff" opacity="0.8" />

  <!-- Central Card / Badge with Soft Glow -->
  <g filter="url(#shadow)">
    <!-- Open Book Base -->
    <path d="M120 330 C180 320 230 335 256 360 C282 335 332 320 392 330 L392 200 C332 190 282 205 256 226 C230 205 180 190 120 200 Z" fill="url(#bookGrad)" />
    <!-- Book Spine Divider -->
    <path d="M256 226 L256 360" stroke="#c084fc" stroke-width="4" stroke-linecap="round" />
    <!-- Left Page Text lines -->
    <line x1="150" y1="230" x2="225" y2="225" stroke="#a855f7" stroke-width="4" stroke-linecap="round" />
    <line x1="150" y1="250" x2="230" y2="245" stroke="#c084fc" stroke-width="4" stroke-linecap="round" />
    <line x1="150" y1="270" x2="210" y2="265" stroke="#c084fc" stroke-width="4" stroke-linecap="round" />
    <line x1="150" y1="290" x2="228" y2="285" stroke="#c084fc" stroke-width="4" stroke-linecap="round" />
    <!-- Right Page Text lines -->
    <line x1="287" y1="225" x2="362" y2="230" stroke="#ec4899" stroke-width="4" stroke-linecap="round" />
    <line x1="282" y1="245" x2="362" y2="250" stroke="#f472b6" stroke-width="4" stroke-linecap="round" />
    <line x1="282" y1="265" x2="340" y2="270" stroke="#f472b6" stroke-width="4" stroke-linecap="round" />
    <line x1="284" y1="285" x2="362" y2="290" stroke="#f472b6" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Best Friends Twin Hearts on top -->
  <g transform="translate(196, 110)">
    <path d="M30 45 C15 30 0 45 0 60 C0 80 30 100 30 100 C30 100 60 80 60 60 C60 45 45 30 30 45 Z" fill="#f43f5e" transform="rotate(-15 30 60)" />
    <path d="M90 45 C75 30 60 45 60 60 C60 80 90 100 90 100 C90 100 120 80 120 60 C120 45 105 30 90 45 Z" fill="#ec4899" transform="rotate(15 90 60)" />
    <!-- Star sparkle in between -->
    <polygon points="60,25 64,36 75,37 66,45 69,56 60,50 51,56 54,45 45,37 56,36" fill="#fef08a" />
  </g>

  <!-- Study Besties Banner Label Ribbon -->
  <g transform="translate(96, 395)">
    <rect width="320" height="48" rx="24" fill="#ffffff" opacity="0.95" />
    <text x="160" y="31" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#6b21a8" text-anchor="middle" letter-spacing="2">STUDY BESTIES</text>
  </g>
</svg>
